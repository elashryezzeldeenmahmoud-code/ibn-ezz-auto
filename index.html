<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ibn Ezz Auto | ابن عز أوتو</title>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f0f12; color: #fff; }

        /* Navbar & Logo Styling */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #16161a;
            padding: 15px 8%;
            border-bottom: 2px solid #e63946;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-badge {
            background-color: #e63946;
            color: #fff;
            font-weight: 900;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 20px;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(230, 57, 70, 0.5);
        }

        .logo-text {
            font-size: 22px;
            font-weight: bold;
            color: #fff;
        }

        .logo-text span { color: #e63946; }

        /* Navigation Links & Buttons */
        .nav-links { display: flex; gap: 15px; align-items: center; }
        
        .btn-whatsapp {
            background-color: #25d366;
            color: #fff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        /* Hero Banner */
        .hero {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(180deg, #16161a 0%, #0f0f12 100%);
        }

        .hero h2 { font-size: 28px; margin-bottom: 10px; color: #fff; }
        .hero p { color: #a0a0a5; font-size: 16px; }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header class="navbar">
        <div class="logo-box">
            <div class="logo-badge">IEA</div>
            <div class="logo-text">Ibn Ezz <span>Auto</span></div>
        </div>
        <nav class="nav-links">
            <a href="https://wa.me/201000000000" class="btn-whatsapp" target="_blank">واتساب المعرض</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h2>أفخم السيارات بأعلى حالة وأفضل سعر</h2>
        <p>مرحباً بك في ابن عز أوتو - اختيارك الأول للثقة والتميز</p>
    </section>

</body>
</html>
